<!DOCTYPE html>
<html>

<head>
    <title>Login Page | CodeMine Student Management</title>
    <link href="{{url_for('static',filename='css/bootstrap.min.css')}}" rel="stylesheet" />
    <link href="{{url_for('static',filename='css/style.css')}}" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="col-xl-12">
            <div class="row">
                <div class="col-xl-4 login-border login-margin-top-7">
                    <div class="col-xl-12">
                        <h2 class="login-title">Login</h2>
                    </div>
                    <form method="post" action="/login">
                        <div class="col-xl-12">
                            <h4 class="login-label">Username</h4>
                        </div>
                        <div class="col-xl-12">
                            <input type="text" name="txtUsername" class="form-control" />
                        </div>
                        <div class="col-xl-12">
                            <h4 class="login-label">Password</h4>
                        </div>
                        <div class="col-xl-12">
                            <input type="password" name="txtPassword" class="form-control" />
                        </div>
                        <div class="col-xl-12">
                            <input type="submit" value="Login" class="btn btn-primary login-button" />
                        </div>
                    </form>

                    <div class="col-xl-12">
                        <p class="login-misc">Dont have account? <a href="/register">Create Now</a></p>
                    </div>
                    <div class="col-xl-12">
                        {{message}}
                    </div>
                </div>
                <div class="col-xl-8 login-margin-top-7">
                    <div class="col-xl-12">
                        <img src="{{url_for('static',filename='images/login_banner.png')}}" class="img-fluid" />
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
